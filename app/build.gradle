plugins { id 'com.android.application' }

android {
    namespace 'top.chakmabangla.app'
    compileSdk 34
    defaultConfig {
        applicationId "top.chakmabangla.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so it installs directly. Use your own key for Play Store.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
